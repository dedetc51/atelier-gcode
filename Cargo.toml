[package]
name = "atelier-gcode"
version = "0.3.0"
repository = "https://github.com/dedetc51/atelier-gcode"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
curl = { version = "0.4", features = ["protocol-ftp", "static-curl", "static-ssl"] }
md-5 = "0.10"
native-tls = "0.2"
open = "5"
regex = "1"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-native-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "6", default-features = false, features = ["deflate"] }
